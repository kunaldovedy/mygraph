  source: public-web-indexed
  confidence: high
  refs: [https://sierra.technology/]

- id: v-innovation-at-the-edge
  type: value
  label: Innovation at the edge
  subtitle: New things start where the people are
  summary: >-
    A stated value of Sierra Technology, in its own words: it "creates an
