  source: public-web-indexed
  confidence: high
  refs: [https://sierra.technology/]

- id: v-shared-knowledge
  type: value
  label: Knowledge shared, not hoarded
  subtitle: The open source movement, as a way of thinking
  summary: >-
    In his own words: "I feel motivated and inspired by those who innovate and
    share their knowledge with those who need it. I feel that this method of
    thinking is very much like the open source movement, of which I have the
    utmost respect."
  source: public-web
  confidence: high
  refs: [https://www.kunaldovedy.com/about]

- id: v-collaboration
  type: value
  label: Build the team, not the hero
  subtitle: Capability over dependency
  summary: >-
    Success looks like a group that can carry on without him. His own public
    description of the work is to "build highly collaborative teams", and he
    confirmed this framing of why.
  source: self
  confidence: high

- id: v-play-as-doorway
  type: value
  label: Play is the doorway
  subtitle: Discovery before instruction
  summary: >-
    At Burning Man 2013 nobody handed out instructions. Participants worked
    out how to play a jet engine by dropping ball bearings into it. Curiosity
    did the teaching.
  source: inferred
  confidence: medium
  refs: [http://www.turbinophone.com/]

- id: v-machines-can-sing
  type: value
  label: Machines can sing
  subtitle: Repurpose, do not scrap
  summary: >-
    A compressor that pushed an F-4 Phantom past Mach 2 now rings like a set
