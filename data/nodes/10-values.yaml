# Stage 1 — what must stay true.
#
# Four of these are Sierra Technology's own stated values, in its own words.
# Two come from the About page on kunaldovedy.com. One the subject confirmed
# directly. Two remain read between the lines of the Turbinophone's story.

- id: v-connected-creativity
  type: value
  label: Connected Creativity
  subtitle: The banner over all of it
  summary: >-
    Creativity is not a solo act. The work is worth doing when it connects
    people to each other, and connects the technical to the human.
  source: public-web
  confidence: high
  refs: [https://www.kunaldovedy.com/]

- id: v-enhance-humanity
  type: value
  label: Enhance humanity
  subtitle: The test a project has to pass
  summary: >-
    Dovedy LLC was founded for multidisciplinary projects meant to enhance
    humanity. That is the filter: does this leave people better off.
  source: public-profile
  confidence: high
  refs: [https://www.linkedin.com/in/kdovedy/]

- id: v-information-over-control
  type: value
  label: Information is greater than control
  subtitle: Decision making comes before preventing bad outcomes
  summary: >-
    A stated value of Sierra Technology, in its own words: it "places the
    sovereignty of decision making before limiting undesired scenarios." Give
    people what they need to decide rather than narrowing what they are allowed
    to do.
  source: public-web-indexed
  confidence: high
  refs: [https://sierra.technology/]

- id: v-data-transparency
  type: value
  label: Data transparency
  subtitle: Trust is downstream of access
  summary: >-
    A stated value of Sierra Technology, in its own words: it "increases trust
    in the company, by making data immediate, available, and usable."
  source: public-web-indexed
  confidence: high
  refs: [https://sierra.technology/]

- id: v-freeing-humans
  type: value
