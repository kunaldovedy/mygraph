- id: w-turbinophone
  type: work
  label: The Turbinophone
  subtitle: A jet engine you play with ball bearings
  summary: >-
    A J79 turbojet compressor, taken from an engine that pushed an F-4 Phantom
    past Mach 2 on 17,000 pounds of thrust, rebuilt as a collaborative musical
    instrument. Drop a steel ball bearing in the top. It strikes the blades,
    which ring like tuning forks. The blades get shorter on the way down, so the
    pitch rises as the bearing falls.
  source: public-web
  confidence: high
  refs:
    - http://www.turbinophone.com/
    - https://www.kickstarter.com/projects/kdovedy/the-turbinophone-burning-man-2013
  props:
    years: 2013 to present
    material: J79 turbojet compressor section
    award: Best in Class, Maker Faire Bay Area 2014
    home: Oakland Aviation Museum

